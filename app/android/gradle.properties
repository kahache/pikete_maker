org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 migration flags (#79), same as the Flutter 3.44.6 template: keep the
# classic DSL and the standalone Kotlin Gradle Plugin until Flutter itself
# migrates. (android.enableJetifier was removed: Jetifier no longer exists in
# AGP 9 and no dependency needs it.)
android.newDsl=false
android.builtInKotlin=false
# #79: the third-party tflite_flutter plugin pins its Java compile target to 11
# but its Kotlin task compiles to 17; KGP 2.x turns that intra-module mismatch
# into a hard error. We don't control that plugin, and both 11- and 17-target
# bytecode run fine on our minSdk 24 (D8/R8 desugars), so downgrade the check
# to a warning (JetBrains' documented escape hatch). Revisit if tflite_flutter
# ships a build.gradle that sets a consistent jvmTarget.
kotlin.jvm.target.validation.mode=warning
