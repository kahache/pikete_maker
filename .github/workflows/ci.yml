# PiketeMaker CI (issue #42): smoke suite on every push/PR to main.
#
# Goal: <10 min total. No APK builds, no artifacts — this is a guardrail for a
# multi-machine workflow, not a release pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (security audit Q2, 2026-10-01): the jobs only read the
# checkout. No job needs to write to the repo, packages, issues or PRs, and no
# secret is used anywhere in this workflow — keep it that way.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR (saves minutes and queue time).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-colorlab:
    name: Python (colorlab — ruff + fast pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA (a tag can be
      # moved by whoever controls the action repo; a SHA cannot). The tag in
      # the comment is the release the SHA was taken from (2026-10-01). To
      # bump: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step talks to git: do not leave the job token in .git/config
          # where a dependency's install/test code could read it.
          persist-credentials: false

      # Python 3.12, NOT 3.14: onnxruntime publishes no wheel for 3.14 and 3.12
      # has full wheel coverage for the CV stack. The library degrades to
      # GrabCut without onnxruntime, so 3.14 works locally too — it is just
      # slower to resolve here.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # PINNED install (review F17, 2026-09-30): requirements.txt is the frozen
      # resolution of cv_core/pyproject.toml (still the source of truth for
      # the dependency LIST) and it pins the dev tools too — pytest, ruff,
      # mypy. `--no-deps` on the editable install guarantees nothing unpinned
      # is pulled in: a new ruff formatter or sklearn release cannot turn this
      # public CI red while the project is parked.
      - name: Install pinned requirements + colorlab (editable, no deps)
        run: |
          pip install -r requirements.txt
          pip install --no-deps -e cv_core

      # Formatting and lint are gated, not advisory. Config: root ruff.toml
      # (one config for cv_core/ and backend/).
      - name: ruff format --check
        run: ruff format --check .

      - name: ruff check
        run: ruff check .

      # Type check of the library only (config in cv_core/pyproject.toml;
      # mypy reads the config of its cwd). 0 errors since package E4.
      - name: mypy (colorlab)
        working-directory: cv_core
        run: mypy

      # Fast tests only. The `slow`-marked tests run the real CV stack over the
      # real photos in samples/, which are not part of a public clone — they
      # are local-only by design and would fail here for lack of inputs.
      - name: pytest -m "not slow"
        working-directory: cv_core
        run: pytest -m "not slow"

      - name: CLI smoke check
        run: colorlab --help

  flutter-app:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # No later step talks to git: do not leave the job token in .git/config
          # where a dependency's install/test code could read it.
          persist-credentials: false

      # Pinned to the SDK the app is actually built and signed with, so CI and
      # local analyze/test agree.
      # NOTE: app/android/key.properties does not exist in CI; build.gradle
      # degrades to debug signing, and no APK is compiled here anyway.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: app
        run: flutter pub get

      - name: flutter analyze
        working-directory: app
        run: flutter analyze

      - name: flutter test
        working-directory: app
        run: flutter test
