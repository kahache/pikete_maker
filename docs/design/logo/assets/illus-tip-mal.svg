<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="Foto mal hecha: la misma figura en un cuarto recargado">
  <!-- misma pared, pero con lío detrás -->
  <rect width="160" height="120" fill="#F7F5FB"/>
  <rect y="102" width="160" height="18" fill="#E9E6F2"/>

  <!-- cuadro torcido -->
  <g transform="rotate(-8 30 28)">
    <rect x="16" y="16" width="28" height="22" rx="2" fill="#FFFFFF" stroke="#D9D3E6" stroke-width="2.5"/>
    <rect x="21" y="22" width="18" height="10" rx="1.5" fill="#EFEAFB"/>
  </g>
  <!-- estantería con libros/trastos -->
  <g>
    <rect x="106" y="38" width="44" height="4" rx="2" fill="#D9D3E6"/>
    <rect x="110" y="22" width="7" height="16" rx="1.5" fill="#C9C2DB"/>
    <rect x="119" y="18" width="7" height="20" rx="1.5" fill="#EFEAFB"/>
    <rect x="128" y="25" width="7" height="13" rx="1.5" fill="#DFF7F1"/>
    <rect x="137" y="20" width="9" height="18" rx="4.5" fill="#D9D3E6"/>
  </g>
  <!-- póster pequeño -->
  <rect x="120" y="56" width="22" height="16" rx="2" fill="#FFFFFF" stroke="#D9D3E6" stroke-width="2.5"/>
  <line x1="124" y1="61" x2="138" y2="61" stroke="#C9C2DB" stroke-width="2" stroke-linecap="round"/>
  <line x1="124" y1="66" x2="134" y2="66" stroke="#C9C2DB" stroke-width="2" stroke-linecap="round"/>

  <!-- ropa tirada por el suelo -->
  <g>
    <ellipse cx="26" cy="102" rx="16" ry="6" fill="#C9C2DB"/>
    <ellipse cx="38" cy="99" rx="10" ry="5" fill="#EFEAFB"/>
    <ellipse cx="136" cy="103" rx="13" ry="5.5" fill="#DFF7F1"/>
    <ellipse cx="126" cy="100" rx="8" ry="4" fill="#D9D3E6"/>
  </g>

  <!-- sombra + la MISMA figura que en BIEN -->
  <ellipse cx="80" cy="104" rx="18" ry="3.5" fill="#D9D3E6"/>
  <g fill="#544E68">
    <circle cx="80" cy="30" r="8.5"/>
    <rect x="68.5" y="42" width="23" height="34" rx="10"/>
    <rect x="72" y="72" width="6.6" height="32" rx="3.3"/>
    <rect x="81.4" y="72" width="6.6" height="32" rx="3.3"/>
  </g>
</svg>
